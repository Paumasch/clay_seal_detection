<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: sans-serif;
      overflow: hidden;
    }
    video {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
    }
    /* Fake bounding box */
    #box {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 400px;
      height: 380px;
      border: 3px solid red;
      transform: translate(-50%, -50%);
      box-sizing: border-box;
      transition: border-color 0.3s ease;
    }
    #box.detected {
      border-color: lime;
    }
    /* Detection caption */
    #overlay {
      position: fixed;
      bottom: 8%;
      left: 5%;
      right: 5%;
      padding: 16px;
      background: rgba(0,0,0,0.75);
      border-radius: 12px;
      display: block;
      text-align: center;
      font-size: 20px;
    }
  </style>
</head>

<body>
  <video autoplay playsinline></video>
  <div id="box"></div>
  <div id="overlay">
    Model initialising.
  </div>

  <script>
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" }
    }).then(stream => {
      document.querySelector("video").srcObject = stream;
    });

    let state = -3;
    const box = document.getElementById("box");
    const overlay = document.getElementById("overlay");

    document.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        
      if (state === -3) {
          overlay.innerHTML = "Model initialising..";
      }	
      else if (state === -2) {
          overlay.innerHTML = "Model initialising...";
      }	 	 
      else if (state === -1) {
          overlay.innerHTML = "Initialisation successful!";
      }	 	  
      else if (state === 0) {
        box.classList.remove("detected");
          overlay.innerHTML = "That's not a seal";
      }
      else if (state === 1) {
        box.classList.add("detected");
          overlay.innerHTML = "Yep, those are seals!";
      }
        else if (state === 2) {
          // First press: detection!
          box.classList.add("detected");
          overlay.innerHTML = "Yep, those are seals!<br>The other one was way cuter, though...";
        } else if (state === 3) {
          // Second press: lost it
          box.classList.remove("detected");
          overlay.innerHTML = "Noo!! bring it back! 😭";
        } else if (state === 4) {
          // Third press: detection!
          box.classList.add("detected");
          overlay.innerHTML = "Yay!";
      state = -1; // reset
      }	
      state++;
      }
    });
  </script>
</body>
</html>
