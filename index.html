<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="config.js"></script> <!-- this needs to be above any script files that accesses it -->
  <title data-i18n="welcomeTitle">Seal Counter</title>
  <link rel="stylesheet" href="style.css">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#222222">
  <script src="js/register-sw.js"></script>
</head>

<body style="background-color:rgb(175, 172, 188);">
  <main>
    <nav class="top-nav" aria-label="Primary navigation">
      <span aria-hidden="true"></span>

      <div class "language_selection_dropdown">
          <button id ="englishButton">English</button>
          <button id="danishButton">Danish</button>
          <button id="Kalaallisut">Kalaallisut</button>
      </div id= "languageMessage" role="status" hidden>
    </nav>

    <h1 id="Header">
        <a class="pageTitlelogo" href="/">
            <img src="images/SealDetectionLogo.png"  width="300" height="150">
        </a>
    </h1>   

    <h3> 
        <p>
            This webpage was developed as a simple demonstration of an object detection model.
            The model type is called YOLOv8n. The Aria-funded DronePort Project is using a similar model to
            detect and count the Kangia Ringed Seal Population in the Ilulissat Icefjord.            
        </p>
    </h3
    
    <a class="button" href="app.html" data-i18n="startButton">
      Start
    </a>
  </main>

  <!--MARK: scripts
  notes:  - config.js and register-sw.js need to be loaded early (therefore sitting in head)
          - the remaining scripts need to be ordered by dependence 
            (welcome loads strings, therefore loaded last)
  -->
  <script src="js/strings.js"></script>
  <script src="js/welcome.js"></script>
</body>

</html>
