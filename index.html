<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="config.js"></script> <!-- this needs to be above any script files that accesses it -->
  <title data-i18n="welcomeTitle">Seal Counter</title>
  <link rel="stylesheet" href="style.css">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#222222">
  <script src="js/register-sw.js"></script>
</head>

<!-- remove `class="debug-layout"` when done fiddling -->
<body class="debug-layout" style="background-color:rgb(180, 180, 180);">
  <main>

    <nav class="top-nav" aria-label="Primary navigation">

      <a class="home-link" href="/" aria-label="Seal Counter home">
        <img
          class="home-logo"
          src="assets/seal-logo-nobackground_2.png"
          onmouseover="this.src='assets/seal-logo-nobackground_2_detected_wink.png'"
          onmouseout="this.src='assets/seal-logo-nobackground_2.png'"
          alt="Seal Counter"
          width="120"
          height="50">
      </a>

      <a class="Page_Title" aria-label="Page Title" data-i18n="Page_Title"> 
        <h1 data-i18n="Page_Title">You are getting warmer!</h1>
      </a>

      <!--Language Selection Dropdown-->
      <!-- The language icons need to be connected to the language in the textelements part to work-->
      <div class="language_selection_dropdown">
        <button id="languageSelection" class="lang-btn" aria-haspopup="listbox" aria-expanded="false">
          <img id="currentFlag" src="assets/flagpack--gl.svg" alt="" width="20" height="15">
          <span></span> ▾
        </button>
        <ul id="langMenu" hidden role="listbox">
          <li data-lang="Kalaallisut" data-flag="assets/flagpack--gl.svg" tabindex="0">
            <img src="assets/flagpack--gl.svg" alt="" width="20" height="15">
          </li>
          <li data-lang="Danish" data-flag="assets/flagpack--dk.svg" tabindex="0">
            <img src="assets/flagpack--dk.svg" alt="" width="20" height="15">
          </li>
          <li data-lang="English" data-flag="assets/flagpack--gb.svg" tabindex="0">
            <img src="assets/flagpack--gb-ukm.svg" alt="" width="20" height="15">
          </li>
        </ul>
      </div>
      
    </nav>

    <h3> 
        <p id = "Welcomeparagraph" class = "welcome-paragraph" data-i18n="Welcomeparagraph">            
        </p>
    </h3>
    
    <a class="button" href="app.html" data-i18n="startButton" 
        style="  display: block; margin-left: auto; margin-right: auto; width: 40%; text-align:center;">
      Start
    </a>
  </main>

  <!--MARK: scripts
  notes:  - config.js and register-sw.js need to be loaded early (therefore sitting in head)
          - the remaining scripts need to be ordered by dependence 
            (welcome loads textelements, therefore loaded last)
  -->
  <script src="js/textelements.js"></script>
  <script src="js/welcome.js"></script>
</body>

<footer>
  <p class="footer-text">
    &copy; A
      <span class="footer-name" aria-label="Gårmitz production">
        <span class="footer-name-combined" aria-hidden="true">Gårmitz</span>
        <span class="footer-name-split">
          <a href="https://github.com/Paumasch/clay_seal_detection">Gårdman</a>
          <span class="footer-name-amp" aria-hidden="true">&amp;</span>
          <a href="https://github.com/smitzkar">Schmitz</a>
        </span>
      </span>
      production.
  </p>
</footer>

</html>
