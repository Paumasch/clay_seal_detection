<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="config.js"></script> <!-- this needs to be above any script files that accesses it -->
  <title data-i18n="welcomeTitle">Seal Counter</title>
  <link rel="stylesheet" href="style.css">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#222222">
  <script src="js/register-sw.js"></script>
</head>

<body>
  <main>
    <nav class="top-nav" aria-label="Primary navigation">
      <span aria-hidden="true"></span>

      <div class="language-area">
        <button id="languageButton" type="button" aria-expanded="false" aria-controls="languageMessage" data-i18n="languageButton">
          Language
        </button>
        <div id="languageMessage" role="status" hidden>
          The translators don't like being rushed.
        </div>
      </div>
    </nav>

    <h1 data-i18n="welcomeTitle">Seal Sleuth</h1>

    <img src="assets/visual-guide-placeholder.svg" alt="Placeholder for the visual guide" class="guide-image">

    <a class="button" href="app.html" data-i18n="startButton">
      Start
    </a>
  </main>

  <!--MARK: scripts
  notes:  - config.js and register-sw.js need to be loaded early (therefore sitting in head)
          - the remaining scripts need to be ordered by dependence 
            (welcome loads strings, therefore loaded last)
  -->
  <script src="js/strings.js"></script>
  <script src="js/welcome.js"></script>
</body>

</html>
