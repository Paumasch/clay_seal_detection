<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="config.js"></script> <!-- this needs to be above any script files that accesses it -->
  <title data-i18n="appTitle">Seal detector</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#222222">
  <script src="js/register-sw.js"></script>
</head>

<!-- remove `class="debug-layout"` when done fiddling -->
<body class="debug-layout" style="background-color:rgb(180, 180, 180);">
  <main>
    <nav class="top-nav" aria-label="Primary navigation">

      <a href="index.html" class = "back-link" data-i18n="backButton">Back</a>
      
      <span aria-hidden="true"></span>
      <!--Language Selection Dropdown-->
      <!-- The language icons need to be connected to the language in the textelements part to work-->
      <div class="language_selection_dropdown">
        <button id="languageSelection" class="lang-btn" aria-haspopup="listbox" aria-expanded="false">
          <img id="currentFlag" src="assets/flagpack--gl.svg" alt="" width="20" height="15">
          <span></span> ▾
        </button>
        <ul id="langMenu" hidden>
          <li data-lang="Kalaallisut" data-flag="assets/flagpack--gl.svg" tabindex="0">
            <img src="assets/flagpack--gl.svg" alt="" width="20" height="15">
          </li>
          <li data-lang="Danish" data-flag="assets/flagpack--dk.svg" tabindex="0">
            <img src="assets/flagpack--dk.svg" alt="" width="20" height="15">
          </li>
          <li data-lang="English" data-flag="assets/flagpack--gb.svg" tabindex="0">
            <img src="assets/flagpack--gb-ukm.svg" alt="" width="20" height="15">
          </li>
        </ul>
      </div>

      <div id="languageMessage" role="status" hidden></div>
    </nav>

    <h1 id="Header">
        <a class="pageTitlelogo" href="/">
            <img src="assets/seal_detection_front_logo.png" width="300" height="50">
        </a>
    </h1>

    <!--MARK: camera-->
    <section aria-labelledby="cameraHeading">
      <h2 id="cameraHeading" data-i18n="cameraHeading">Camera</h2>

      <div id="viewport" class="viewport">
        <video id="cameraVideo" class="camera-feed" playsinline autoplay muted></video>
        <canvas id="snapshotCanvas" class="camera-feed" hidden></canvas>
        <div id="detectionBox" class="detection-box" hidden></div>
        <div id="liveDetectionIndicator" class="live-detection-indicator" role="status" aria-live="polite" hidden></div>
      </div>

      <button id="liveDetectionButton" type="button" data-i18n="liveDetectionButton">
        Start live detection
      </button>

      <button id="snapshotButton" type="button" data-i18n="snapshotButton">
        Take snapshot
      </button>

      <button id="resetButton" type="button" data-i18n="resetButton" hidden>
        Reset
      </button>

    </section>

    <section aria-labelledby="statusHeading">
      <h2 id="statusHeading" data-i18n="statusHeading">Status</h2>
      <p id="statusMsg" role="status" data-i18n="statusReady">Ready.</p>
    </section>

    <section aria-labelledby="detectionHeading">
      <h2 id="detectionHeading" data-i18n="detectionHeading">Detection</h2>

      <div id="detectionPlaceholder" aria-live="polite">
        Detection result will appear here.
      </div>

    </section>

  </main>

  <!--MARK: scripts
  notes:  - config.js and register-sw.js need to be loaded early (therefore sitting in head)
          - the remaining scripts need to be ordered by dependence 
            (app loads textelements and detectors, therefore loaded last)
  -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script> <!--MARK: temporary-->
  <script src="js/textelements.js"></script>
  <script src="js/detectors.js"></script>
  <script src="js/app.js"></script>
</body>

<footer>
  <p class="footer-text" data-i18n="footerText">
    &copy; <a href="https://github.com/Paumasch/clay_seal_detection">A Gårmitz production.</a>
</footer>

</html>
