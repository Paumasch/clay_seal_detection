<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="config.js"></script> <!-- this needs to be above any script files that accesses it -->
  <title data-i18n="appTitle">Now you seal me</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#222222">
  <script src="js/register-sw.js"></script>
</head>

<body style="background-color:rgb(175, 172, 188);">
  <main>
    <nav class="top-nav" aria-label="Primary navigation">
      <a href="index.html" class = "back-link" data-i18n="backButton">Back</a>
      
      <span aria-hidden="true"></span>
      <!--Language Selection Dropdown-->
      <div class="language_selection_dropdown">
        <label for="languageSelection" data-i18n="languageSelection">Choose a language:</label>
        <select name="languageSelection" id="languageSelection" aria-label="Language selection">
          <option value="Kalaallisut"><a class="flag-icon" href="/">
            <img src="images/GreenlandFlag.png" alt="Greenland Flag" width="20" height="15">
            </a>
          </option>
          <option value="Danish"><a class="flag-icon" href="/">
            <img src="images/DenmarkFlag.png" alt="Denmark Flag" width="20" height="15">
            </a>
          </option>
          <option value="English"><a class="flag-icon" href="/">
            <img src="images/UKFlag.png" alt="UK Flag" width="20" height="15">
            </a>
          </option>
        </select>
      </div id= "languageMessage" role="status" hidden>
    </nav>

    <h1 id="Header">
        <a class="pageTitlelogo" href="/">
            <img src="images/SealDetectionLogo.png"  width="100" height="100">
        </a>
    </h1>

    <!--MARK: camera-->
    <section aria-labelledby="cameraHeading">
      <h2 id="cameraHeading" data-i18n="cameraHeading">Camera</h2>

      <div id="viewport" class="viewport">
        <video id="cameraVideo" class="camera-feed" playsinline autoplay muted></video>
        <canvas id="snapshotCanvas" class="camera-feed" hidden></canvas>
        <div id="detectionBox" class="detection-box" hidden></div>
        <div id="liveDetectionIndicator" class="live-detection-indicator" role="status" aria-live="polite" hidden></div>
      </div>

      <button id="liveDetectionButton" type="button" data-i18n="liveDetectionButton">
        Start live detection
      </button>

      <button id="snapshotButton" type="button" data-i18n="snapshotButton">
        Take snapshot
      </button>

      <button id="resetButton" type="button" data-i18n="resetButton" hidden>
        Reset
      </button>

    </section>

    <section aria-labelledby="statusHeading">
      <h2 id="statusHeading" data-i18n="statusHeading">Status</h2>
      <p id="statusMsg" role="status" data-i18n="statusReady">Ready.</p>
    </section>

    <section aria-labelledby="detectionHeading">
      <h2 id="detectionHeading" data-i18n="detectionHeading">Detection</h2>

      <div id="detectionPlaceholder" aria-live="polite">
        Detection result will appear here.
      </div>

    </section>

  </main>

  <!--MARK: scripts
  notes:  - config.js and register-sw.js need to be loaded early (therefore sitting in head)
          - the remaining scripts need to be ordered by dependence 
            (app loads textelements and detectors, therefore loaded last)
  -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script> <!--MARK: temporary-->
  <script src="js/textelements.js"></script>
  <script src="js/detectors.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
