<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="appTitle">Seal Counter</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#222222">
  <script src="js/register-sw.js"></script>
  <script src="version.js"></script>
</head>

<body>
  <main>
    <a href="index.html" class="back-link" data-i18n="backButton">Back</a>

    <h1 data-i18n="appTitle">Seal Counter</h1>

    <section aria-labelledby="cameraHeading">
      <h2 id="cameraHeading" data-i18n="cameraHeading">Camera</h2>

      <div id="cameraPlaceholder" class="camera-placeholder" aria-live="polite">
        Camera preview will appear here.
      </div>

      <button id="snapshotButton" type="button" data-i18n="snapshotButton">
        Take snapshot
      </button>
    </section>

    <section aria-labelledby="statusHeading">
      <h2 id="statusHeading" data-i18n="statusHeading">Status</h2>
      <p id="status" role="status" data-i18n="statusReady">Ready.</p>
    </section>

    <section aria-labelledby="detectionHeading">
      <h2 id="detectionHeading" data-i18n="detectionHeading">Detection</h2>

      <div id="detectionPlaceholder" aria-live="polite">
        Detection result will appear here.
      </div>

      <button id="resetButton" type="button" data-i18n="resetButton">
        Reset
      </button>
    </section>
  </main>

  <script src="js/strings.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
